# FIPS compliance gate — enforced in CI via `cargo deny check bans`.
# Any crate below entering the dependency graph fails the build.

[graph]
all-features = false

[bans]
multiple-versions = "allow"
deny = [
    # Non-FIPS-validated crypto providers. All crypto must flow through
    # aws-lc-rs in FIPS mode (pulled in by rustls's `fips` feature).
    { crate = "ring", reason = "no FIPS validation; aws-lc-rs FIPS is the only permitted crypto provider" },
    { crate = "openssl", reason = "system OpenSSL is not the validated module; use rustls + aws-lc-rs FIPS" },
    { crate = "openssl-sys", reason = "system OpenSSL is not the validated module; use rustls + aws-lc-rs FIPS" },
    { crate = "native-tls", reason = "delegates to platform TLS outside the validated module" },
    # Non-approved algorithms for security functions.
    # Exceptions: (1) aws-smithy-checksums uses MD5 solely for the S3
    # Content-MD5 wire-protocol integrity header — a non-security use
    # permitted under FIPS. (2) sqlx-postgres carries MD5 only for the
    # legacy Postgres md5 auth method; deployments MUST use scram-sha-256
    # (the Postgres 14+ default), making it dead code on the wire.
    # Any other consumer of md-5 stays banned.
    { crate = "md-5", reason = "MD5 is not FIPS-approved", wrappers = ["aws-smithy-checksums", "sqlx-postgres", "sqlx-macros-core"] },
    { crate = "md5", reason = "MD5 is not FIPS-approved" },
    { crate = "sha1_smol", reason = "SHA-1 is not FIPS-approved for new signatures" },
    { crate = "argon2", reason = "not FIPS-approved; use PBKDF2-HMAC-SHA256" },
    { crate = "bcrypt", reason = "not FIPS-approved; use PBKDF2-HMAC-SHA256" },
    { crate = "scrypt", reason = "not FIPS-approved; use PBKDF2-HMAC-SHA256" },
    # Non-FIPS pure-Rust crypto implementations (RustCrypto). Hashing for
    # non-security purposes must use clearly non-cryptographic hashes
    # (xxhash, fnv) instead, so intent stays auditable.
    { crate = "aes", reason = "unvalidated implementation; use aws-lc-rs FIPS" },
    { crate = "rsa", reason = "unvalidated implementation; use aws-lc-rs FIPS" },
]

[licenses]
# Workspace crates are proprietary and unpublished.
private = { ignore = true }
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "OpenSSL",
    "CDLA-Permissive-2.0",
]

[advisories]
yanked = "deny"
