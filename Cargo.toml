[workspace]
resolver = "2"
members = [
    "crates/rsearch-common",
    "crates/rsearch-storage",
    "crates/rsearch-index",
    "crates/rsearch-metastore",
    "crates/rsearch-ingest",
    "crates/rsearch-search",
    "crates/rsearch-server",
    "crates/rsearch-bench",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.dependencies]
rsearch-common = { path = "crates/rsearch-common" }
rsearch-storage = { path = "crates/rsearch-storage" }
rsearch-index = { path = "crates/rsearch-index" }
rsearch-metastore = { path = "crates/rsearch-metastore" }
rsearch-ingest = { path = "crates/rsearch-ingest" }
rsearch-search = { path = "crates/rsearch-search" }

tokio = { version = "1", features = ["full"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
config = { version = "0.15", default-features = false, features = ["toml"] }
clap = { version = "4", features = ["derive", "env"] }
rustls = { version = "0.23", default-features = false, features = ["fips", "logging", "std", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
tokio-rustls = { version = "0.26", default-features = false }
aws-lc-rs = { version = "1", features = ["fips"] }
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
async-trait = "0.1"
bytes = "1"
tempfile = "3"
aws-config = { version = "1", default-features = false, features = ["behavior-version-latest"] }
aws-sdk-s3 = { version = "1", default-features = false, features = ["behavior-version-latest", "rt-tokio"] }
aws-smithy-http-client = { version = "1", features = ["rustls-aws-lc-fips"] }
uuid = { version = "1", features = ["v4"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres", "migrate", "json", "derive", "macros"] }

[profile.release]
lto = "thin"
