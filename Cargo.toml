[workspace]
resolver = "2"
members = [
    "crates/rsearch-common",
    "crates/rsearch-storage",
    "crates/rsearch-index",
    "crates/rsearch-metastore",
    "crates/rsearch-ingest",
    "crates/rsearch-search",
    "crates/rsearch-server",
    "crates/rsearch-bench",
]

[workspace.package]
version = "0.7.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.97"
publish = true
repository = "https://github.com/ZerosAndOnesLLC/rSearch"
readme = "README.md"
keywords = ["search", "logging", "opensearch", "loki", "fips"]
categories = ["database-implementations", "text-processing"]

[workspace.dependencies]
rsearch-common = { path = "crates/rsearch-common", version = "0.7.0" }
rsearch-storage = { path = "crates/rsearch-storage", version = "0.7.0" }
rsearch-index = { path = "crates/rsearch-index", version = "0.7.0" }
rsearch-metastore = { path = "crates/rsearch-metastore", version = "0.7.0" }
rsearch-ingest = { path = "crates/rsearch-ingest", version = "0.7.0" }
rsearch-search = { path = "crates/rsearch-search", version = "0.7.0" }

tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
config = { version = "0.15", default-features = false, features = ["toml"] }
clap = { version = "4", features = ["derive", "env"] }
rustls = { version = "0.23", default-features = false, features = ["fips", "logging", "std", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
tokio-rustls = { version = "0.26", default-features = false }
aws-lc-rs = { version = "1", features = ["fips"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "tokio"] }
http-body-util = "0.1"
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "aws-lc-rs", "webpki-roots", "tls12"] }
url = "2"
futures = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
lru = "0.18"
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
async-trait = "0.1"
bytes = "1"
tempfile = "3"
aws-config = { version = "1", default-features = false, features = ["behavior-version-latest"] }
aws-sdk-s3 = { version = "1", default-features = false, features = ["behavior-version-latest", "rt-tokio"] }
aws-smithy-http-client = { version = "1", features = ["rustls-aws-lc-fips"] }
uuid = { version = "1", features = ["v4"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres", "migrate", "json", "derive", "macros"] }

[profile.release]
lto = "thin"
