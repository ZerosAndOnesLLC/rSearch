# rSearch configuration. Every value below is a default; delete anything
# you don't override. Environment overrides use the RSEARCH_ prefix with
# __ between nested keys, e.g. RSEARCH_HTTP__TLS__ENABLED=true.

[node]
# id defaults to the machine hostname when unset.
# id = "ingest-1"
cluster_name = "rsearch"
# Roles this node runs unless --roles is passed on the command line.
roles = ["ingest", "search", "control"]
# Node-local state: WAL, split cache, staging.
data_dir = "./data"
# Address peers use to reach this node (host:port or full URL). Required in
# multi-node clusters — the default falls back to http.bind_addr, and
# 0.0.0.0 is not dialable by peers.
advertise_addr = ""

[http]
bind_addr = "0.0.0.0:9200"
# Access-Control-Allow-Origin for the browser UI. "*" is convenient; set a
# specific origin to restrict (auth is header-based, so credentials are
# never auto-attached, but restricting is safer).
cors_allow_origin = "*"

[http.tls]
# Production should terminate TLS here (FIPS provider) or at a FIPS-validated
# load balancer. When enabled, both paths are required.
enabled = false
cert_path = ""
key_path = ""

[storage]
# "fs" (local disk), "s3" (AWS S3 or any S3-compatible endpoint), or
# "replicated" (each node's local disk + peer replication — HA on plain
# block storage; requires node.advertise_addr and cluster.internal_token).
backend = "fs"
# fs/replicated backends: local object root.
root = "./data/storage"
# s3 backend:
bucket = ""
endpoint = ""            # custom endpoint for MinIO/S3-compatible; empty = AWS
force_path_style = false # required by MinIO
use_fips_endpoint = false # AWS FIPS endpoints (GovCloud)
region = ""              # defaults to us-east-1; any value works for MinIO
# Static credentials for self-hosted / air-gapped installs. When set, the
# AWS credential chain (and IMDS) is never consulted. Leave empty on AWS to
# use IAM task/instance roles.
access_key_id = ""
secret_access_key = ""
# replicated backend (HA on plain block storage, no external object store):
replication_factor = 2   # copies kept per split across storage nodes
write_quorum = 0         # copies required to ack a write; 0 = min(2, factor)

# Node-to-node settings for the replicated storage backend.
[cluster]
# Shared bearer token authenticating internal peer requests. Required when
# storage.backend = "replicated"; generate with e.g. `openssl rand -hex 32`.
internal_token = ""
# PEM bundle for a private cluster CA (peer TLS). Empty = public webpki
# roots; set this when node certs are signed by an internal CA.
peer_ca_file = ""

[metastore]
# Empty reads the DATABASE_URL environment variable. Postgres must use
# scram-sha-256 authentication (default since Postgres 14).
database_url = ""
max_connections = 10

[ingest]
max_batch_docs = 500000  # cut a split at this many buffered docs...
max_batch_secs = 30      # ...or when the oldest doc reaches this age
document_max_batch_secs = 5  # age bound for document-mode streams (tighter
                         # time-to-searchable; ?refresh=wait_for forces a cut)
queue_capacity = 100000  # per-stream in-flight bound before 429s
memory_budget_mb = 256   # tantivy writer heap per stream worker
wal_segment_mb = 64      # WAL segment rotation size
balance_bulk = true      # hand /_bulk batches round-robin to live ingest
                         # peers (needs cluster.internal_token; keep-alive
                         # clients otherwise pin all work to one node)

[search]
cache_max_mb = 4096      # local split-fragment cache budget

[control]
interval_secs = 15          # background-job tick on the elected leader
merge_min_mb = 100          # published splits smaller than this get merged
merge_max_group = 8         # max splits combined per merge
gc_grace_secs = 600         # delay before deleting marked-for-delete splits
staged_orphan_secs = 3600   # sweep splits stuck in 'staged' after a crash
repair_stale_secs = 300     # replicated backend: holder silence before re-replication
allow_insecure_webhooks = false  # require https + block private IPs for alerts
# Document-mode streams: tombstoned versions are hidden at query time and
# removed physically by compaction, which runs when a stream accumulates
# compact_min_tombstones or its oldest tombstone passes compact_max_age_secs
# (the bound on how long a deleted document survives in storage).
compact_min_tombstones = 1000
compact_max_age_secs = 3600
compact_splits_per_tick = 8
tombstone_purge_grace_secs = 3600  # keep tombstones at least this long after
                                   # every split has applied them

# Network log inputs (disabled by default). Each routes to a stream and is
# subject to routing rules.
[inputs.syslog]
enabled = false
bind_udp = "0.0.0.0:5514"   # empty disables UDP
bind_tcp = "0.0.0.0:5514"   # empty disables TCP
tls_cert_path = ""          # both set = TLS on the TCP listener (FIPS)
tls_key_path = ""
stream = "syslog"

[inputs.gelf]
enabled = false
bind_tcp = "0.0.0.0:12201"
tls_cert_path = ""
tls_key_path = ""
stream = "gelf"
