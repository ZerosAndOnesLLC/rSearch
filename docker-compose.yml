# Reference cluster topology: 2 ingest + 2 search + 1 control node over
# Postgres (metastore) and MinIO (object storage). The same binary runs
# every role. Point shippers at the ingest nodes and dashboards at the
# search nodes (or put a load balancer in front of each pair).
#
# The equivalent kill-a-node test suite runs in
# tests/cluster/run-cluster-test.sh.

x-rsearch-env: &rsearch-env
  DATABASE_URL: postgres://rsearch:rsearch@postgres:5432/rsearch
  RSEARCH_STORAGE__BACKEND: s3
  RSEARCH_STORAGE__BUCKET: rsearch
  RSEARCH_STORAGE__ENDPOINT: http://minio:9000
  RSEARCH_STORAGE__FORCE_PATH_STYLE: "true"
  RSEARCH_STORAGE__ACCESS_KEY_ID: minioadmin
  RSEARCH_STORAGE__SECRET_ACCESS_KEY: minioadmin

x-rsearch-node: &rsearch-node
  build: .
  depends_on:
    postgres:
      condition: service_healthy
    minio-setup:
      condition: service_completed_successfully
  restart: unless-stopped

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: rsearch
      POSTGRES_PASSWORD: rsearch
      POSTGRES_DB: rsearch
    volumes: [pg-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rsearch"]
      interval: 2s
      retries: 30

  minio:
    image: minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes: [minio-data:/data]

  minio-setup:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      sh -c "until mc alias set m http://minio:9000 minioadmin minioadmin; do sleep 1; done
      && mc mb -p m/rsearch"

  ingest-1:
    <<: *rsearch-node
    command: ["--roles", "ingest"]
    environment:
      <<: *rsearch-env
      RSEARCH_NODE__ID: ingest-1
    ports: ["9211:9200"]
    volumes: [ingest1-data:/var/lib/rsearch]

  ingest-2:
    <<: *rsearch-node
    command: ["--roles", "ingest"]
    environment:
      <<: *rsearch-env
      RSEARCH_NODE__ID: ingest-2
    ports: ["9212:9200"]
    volumes: [ingest2-data:/var/lib/rsearch]

  search-1:
    <<: *rsearch-node
    command: ["--roles", "search"]
    environment:
      <<: *rsearch-env
      RSEARCH_NODE__ID: search-1
    ports: ["9221:9200"]

  search-2:
    <<: *rsearch-node
    command: ["--roles", "search"]
    environment:
      <<: *rsearch-env
      RSEARCH_NODE__ID: search-2
    ports: ["9222:9200"]

  control:
    <<: *rsearch-node
    command: ["--roles", "control"]
    environment:
      <<: *rsearch-env
      RSEARCH_NODE__ID: control-1

volumes:
  pg-data:
  minio-data:
  ingest1-data:
  ingest2-data:
