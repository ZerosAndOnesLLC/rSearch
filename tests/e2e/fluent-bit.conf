[SERVICE]
    Flush        1
    Log_Level    info

[INPUT]
    Name         dummy
    Dummy        {"message":"hello from fluent-bit","service":"fb","level":"info"}
    Rate         20

[OUTPUT]
    Name                es
    Match               *
    Host                host.docker.internal
    Port                9200
    Index               fb-logs
    Suppress_Type_Name  On
    Logstash_Format     Off
